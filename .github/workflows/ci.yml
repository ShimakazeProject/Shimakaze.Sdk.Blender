name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Create .venv matching pyproject.toml (venvPath=".", venv=".venv") so
      # pyright resolves the fake-bpy-module stubs for `bpy` imports.
      - name: Install tooling
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Format check
        run: .venv/bin/ruff format --check .

      - name: Type check
        run: .venv/bin/pyright

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: moguri/setup-blender@v1
        with:
          blender-version: '4.5'

      - name: Build extension
        run: |
          mkdir -p dist
          blender --command extension build --source-dir extension --output-dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: shimakaze-sdk
          path: dist/*.zip

